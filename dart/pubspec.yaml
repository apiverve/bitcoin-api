name: apiverve_bitcoin
description: "Bitcoin Price fetches the current Bitcoin price, recent movement direction, and update timestamps in USD. Paid plans can quote across 172 currencies and add market cap, 24-hour volume, supply, all-time highs, 1-hour to 1-year changes, 30-day stats, and hourly and 30-day daily history."
version: 1.2.4
homepage: https://apiverve.com/marketplace/bitcoin?utm_source=dart&utm_medium=referral&utm_content=homepage
repository: https://github.com/apiverve/bitcoin-api/tree/main/dart

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  http: ^1.1.0
  http_parser: ^4.0.0

dev_dependencies:
  lints: ^3.0.0
  test: ^1.24.0
